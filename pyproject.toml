[project]
name = "groundwork-mcp"
version = "0.4.0"
description = "MCP server that clones, parses, and builds a citation-grounded knowledge base from any GitHub repository"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
router = ["laya>=0.3.0"]

[project.scripts]
groundwork-mcp = "groundwork_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_mcp"]

