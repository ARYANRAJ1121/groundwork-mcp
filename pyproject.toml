[project]
name = "groundwork-mcp"
version = "0.5.0"
description = "Local-first MCP server for commit-pinned, citation-grounded codebase search and architecture maps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "code-search", "repository-index", "tree-sitter", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=3.4.6",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.12",
]

[project.optional-dependencies]
router = ["laya>=0.3.0"]
hosted = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
benchmark = []
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/ARYANRAJ1121/groundwork-mcp"
Repository = "https://github.com/ARYANRAJ1121/groundwork-mcp"
Issues = "https://github.com/ARYANRAJ1121/groundwork-mcp/issues"

[project.scripts]
groundwork-mcp = "groundwork_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

