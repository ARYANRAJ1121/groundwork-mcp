services:
  mcp:
    build: .
    environment:
      GROUNDWORK_DATA_DIR: /data
      GROUNDWORK_TRANSPORT: http
      GROUNDWORK_HTTP_HOST: 0.0.0.0
      GROUNDWORK_HTTP_PORT: 8000
      GROUNDWORK_REMOTE_MODE: "1"
      GROUNDWORK_OAUTH_GITHUB_CLIENT_ID: ${GROUNDWORK_OAUTH_GITHUB_CLIENT_ID:?Set GitHub OAuth app ID}
      GROUNDWORK_OAUTH_GITHUB_CLIENT_SECRET: ${GROUNDWORK_OAUTH_GITHUB_CLIENT_SECRET:?Set GitHub OAuth app secret}
      GROUNDWORK_OAUTH_GITHUB_BASE_URL: ${GROUNDWORK_OAUTH_GITHUB_BASE_URL:?Set public HTTPS MCP URL}
      GROUNDWORK_OAUTH_JWT_SIGNING_KEY: ${GROUNDWORK_OAUTH_JWT_SIGNING_KEY:?Set a persistent random signing key}
    volumes:
      - groundwork-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build: .
    entrypoint: ["python", "-m", "groundwork_mcp.hosted"]
    environment:
      GROUNDWORK_DATA_DIR: /data
      GROUNDWORK_REMOTE_MODE: "1"
      GROUNDWORK_WEB_PORT: 8080
    volumes:
      - groundwork-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  groundwork-data:
