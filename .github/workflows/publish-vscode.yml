name: Publish VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - name: Verify tag version when publishing a tagged release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#vscode-v}"
          actual="$(node -p "require('./package.json').version")"
          test "$expected" = "$actual"
      - name: Publish with Marketplace Trusted Publishing
        run: npx @vscode/vsce publish --oidc
